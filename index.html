<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Out of Office – Book a desk</title>
<meta name="description" content="Book a desk at Out of Office coworking, Thessaloniki.">
<style>
  :root {
    --wall: #F6F4F0;
    --paper: #FFFFFF;
    --ink: #26231F;
    --muted: #6B665E;
    --line: #DDD6CB;
    --moss: #3D5A45;
    --moss-dark: #2C4333;
    --oak: #B7793C;
    --birch: #F0E2C6;
    --sun: #F2D14A;
    --error: #A8261D;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--wall); color: var(--ink); font: 16px/1.5 var(--font); }
  main { max-width: 780px; margin: 0 auto; padding: 36px 20px 72px; }

  .brand { margin: 0; font-weight: 600; color: var(--moss); }
  h1 { font-family: var(--font); font-weight: 800; font-size: clamp(42px, 9vw, 72px); line-height: .95; letter-spacing: -.025em; margin: 8px 0 14px; }
  .intro { color: var(--muted); max-width: 48ch; margin: 0 0 28px; }

  .step { display: grid; grid-template-columns: 56px 1fr; gap: 0 12px; padding: 28px 0; border-top: 1.5px solid var(--ink); }
  .step > div { min-width: 0; }
  .num { font: 800 44px/1 var(--font); color: var(--oak); }
  h2 { font: 600 24px/1.2 var(--font); margin: 6px 0 4px; }
  .hint { color: var(--muted); margin: 0 0 16px; font-size: 15px; }

  /* Calendar */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 460px; }
  .wd { font-size: 12px; color: var(--muted); text-align: center; }
  .day { appearance: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 10px; aspect-ratio: 1 / 1; min-height: 42px; padding: 0; font: 600 16px var(--font); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .day small { font-size: 10px; font-weight: 500; color: var(--muted); }
  .day:hover:not(:disabled) { border-color: var(--moss); }
  .day[aria-pressed="true"] { background: var(--moss); border-color: var(--moss); color: #fff; }
  .day[aria-pressed="true"] small { color: #D6E4D8; }
    .day:disabled { background: transparent; border-style: dashed; color: #98A6A9; cursor: not-allowed; }
  .day:disabled .dn { text-decoration: line-through; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--moss); background: var(--paper); color: var(--moss-dark); border-radius: 999px; padding: 5px 10px 5px 14px; font: 500 14px var(--font); cursor: pointer; }
  .chip span { font-size: 18px; line-height: 1; }
  .chip:hover { background: #E7EFE8; }

  /* Floor plan */
  .plan { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 8px; overflow-x: auto; }
  .plan svg { display: block; width: 100%; min-width: 560px; height: auto; }
  .wall { stroke: var(--ink); stroke-width: 7; stroke-linecap: round; }
  .window { stroke: #9FD0E0; stroke-width: 9; stroke-linecap: round; }
  .lbl { font: 600 17px var(--font); fill: #5E5850; }
  .lbl.on-dark { fill: #fff; }
  .arrow { fill: var(--oak); }
  .desk { cursor: pointer; }
  .desk rect.top { fill: var(--birch); stroke: #C4A77A; stroke-width: 2.5; }
  .desk circle { fill: #2B2B2B; stroke: #2B2B2B; }
  .desk text { font: 600 19px var(--font); fill: var(--ink); pointer-events: none; }
  .desk:hover rect.top { fill: #F8EEDA; }
  .desk.taken rect.top { fill: url(#hatch); stroke: #BDB6AA; }
  .desk.taken circle { fill: #BDB6AA; stroke: #BDB6AA; }
  .desk.taken text { fill: #8D877E; }
  .desk.mine rect.top { fill: var(--moss); stroke: var(--moss-dark); }
  .desk.mine text { fill: #fff; }
  .desk.idle { opacity: .6; }
  .desk.viewing rect.top { stroke: var(--ink); stroke-width: 4; }
  .desk:focus { outline: none; }
  .desk:focus-visible rect.top { stroke: var(--sun); stroke-width: 6; }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .legend i { display: inline-block; width: 16px; height: 16px; border-radius: 4px; vertical-align: -3px; margin-right: 6px; border: 2px solid #C4A77A; background: var(--birch); }
  .legend .l-taken { border-color: #BDB6AA; background: repeating-linear-gradient(45deg, #EFECE6 0 3px, #CFC8BC 3px 6px); }
  .legend .l-mine { border-color: var(--moss-dark); background: var(--moss); }

  /* Desk photo: floats on top of the plan */
  .planwrap { position: relative; }
  .preview { position: absolute; top: 10px; right: 10px; z-index: 2; width: min(390px, calc(100% - 20px)); display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: start; padding: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(38, 35, 31, .22); }
  .preview.left { right: auto; left: 10px; }
  .preview[hidden] { display: none; }
  .preview .photo { aspect-ratio: 4 / 5; border-radius: 10px; background: #ECE7DE; overflow: hidden; }
  .preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .preview h3 { font: 600 20px/1.2 var(--font); margin: 2px 36px 6px 0; }
  .preview p { margin: 0 0 8px; font-size: 15px; }
  .preview .status { font-size: 14px; font-weight: 600; }
  .preview .status.ok { color: var(--moss); }
  .preview .status.no { color: #8D877E; }
  .preview.no-photo { grid-template-columns: 1fr; }
  .preview.no-photo .photo { display: none; }
  .preview .close { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: #F1EDE6; color: var(--ink); font: 400 22px/1 var(--font); cursor: pointer; display: grid; place-items: center; }
  .preview .close:hover { background: #E6E0D5; }

  /* Form */
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  label { font-weight: 600; font-size: 14px; }
  textarea { font: 16px var(--font); padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); width: 100%; resize: vertical; }
  textarea:focus { border-color: var(--moss); }
  input { font: 16px var(--font); padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); width: 100%; }
  input:focus { border-color: var(--moss); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, .day:focus-visible, .chip:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .subhead { font-weight: 600; margin: 10px 0 10px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .subhead span, .opt { font-weight: 400; color: var(--muted); font-size: 13px; }
  .summary { margin: 6px 0 14px; font-size: 15px; }
  .primary { width: 100%; border: 0; border-radius: 12px; padding: 16px 22px; background: var(--ink); color: #fff; font: 600 17px var(--font); cursor: pointer; }
  .primary:hover:not(:disabled) { background: var(--moss-dark); }
  .primary:disabled { background: #A5B2B4; cursor: not-allowed; }
  .msg { color: var(--error); margin: 12px 0 0; font-size: 15px; min-height: 1em; }
  .secondary { border: 1.5px solid var(--ink); background: transparent; color: var(--ink); border-radius: 12px; padding: 12px 20px; font: 600 16px var(--font); cursor: pointer; }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .langs { display: flex; gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .langs button { border: 0; background: transparent; color: var(--muted); font: 600 13px var(--font); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--moss); color: #fff; }
  .price { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: -12px 0 28px; font-size: 15px; }
  .price b { color: var(--moss); }
  .price a { color: var(--moss); }
  .total { font-weight: 600; margin: -6px 0 14px; }
  .privacy { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .privacy a { color: var(--moss); }
  .demo { background: #FFF6CF; border: 1px solid #E9D27A; border-radius: 10px; padding: 10px 14px; font-size: 14px; margin: 0 0 20px; }
  .loaderr { color: var(--error); }

  /* Done */
  .done { border-top: 1.5px solid var(--ink); padding-top: 28px; }
  .done h2 { font-size: 34px; }
  .done ul { padding-left: 20px; }

  @media (max-width: 560px) {
    .step { grid-template-columns: 1fr; }
    .num { font-size: 30px; }
    .row { grid-template-columns: 1fr; }
    .preview { grid-template-columns: 88px 1fr; gap: 10px; padding: 10px; }
    .preview p { font-size: 14px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .day, .chip, .desk rect, .primary { transition: background-color .15s, border-color .15s, fill .15s; }
  }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <p class="brand" id="brand">Out of Office</p>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="el" aria-pressed="false">ΕΛ</button>
    </div>
  </div>
  <h1 data-t="title"></h1>
  <p class="intro" data-t="intro"></p>
  <p class="price"><span id="priceLine"></span><span id="monthlyLine"></span></p>

  <p class="hint" id="loading" data-t="loading"></p>

  <div id="app" hidden>
    <section class="step">
      <div class="num" aria-hidden="true">1</div>
      <div>
        <h2 data-t="step1"></h2>
        <p class="hint" id="daysHint"></p>
        <div class="cal" id="cal"></div>
        <div class="chips" id="chips"></div>
      </div>
    </section>

    <section class="step">
      <div class="num" aria-hidden="true">2</div>
      <div>
        <h2 data-t="step2"></h2>
        <p class="hint" id="planHint"></p>
        <div class="planwrap">
          <div class="plan"><svg id="plan" role="group" xmlns="http://www.w3.org/2000/svg"></svg></div>
          <div class="preview" id="preview" hidden aria-live="polite">
            <button type="button" class="close" id="pClose">×</button>
            <div class="photo"><img id="pImg" alt=""></div>
            <div><h3 id="pName"></h3><p id="pAbout"></p><p class="status" id="pStatus"></p></div>
          </div>
        </div>
        <div class="legend"><span><i></i><span data-t="free"></span></span><span><i class="l-taken"></i><span data-t="taken"></span></span><span><i class="l-mine"></i><span data-t="yours"></span></span></div>
      </div>
    </section>

    <section class="step">
      <div class="num" aria-hidden="true">3</div>
      <div>
        <h2 data-t="step3"></h2>
        <div class="field"><label for="name" data-t="fName"></label><input id="name" autocomplete="name"></div>
        <div class="row">
          <div class="field"><label for="email" data-t="fEmail"></label><input id="email" type="email" autocomplete="email" inputmode="email"></div>
          <div class="field"><label for="phone" data-t="fPhone"></label><input id="phone" type="tel" autocomplete="tel" inputmode="tel"></div>
        </div>
        <div class="field"><label for="address" data-t="fAddress"></label><input id="address" autocomplete="street-address"></div>
        <p class="subhead"><span data-t="invoice" style="color:inherit;font-size:inherit;font-weight:inherit"></span> <span data-t="optional"></span></p>
        <div class="field"><label for="company" data-t="fCompany"></label><input id="company" autocomplete="organization"></div>
        <div class="field"><label for="vat" data-t="fVat"></label><input id="vat" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="comments"><span data-t="fComments"></span> <span class="opt" data-t="optional"></span></label><textarea id="comments" rows="3" maxlength="500"></textarea></div>
        <p class="summary" id="summary"></p>
        <p class="total" id="total" hidden></p>
        <button class="primary" id="bookBtn" type="button" disabled></button>
        <p class="msg" id="msg" role="alert"></p>
        <p class="privacy"><span data-t="privacy"></span> <a id="privacyLink" href="privacy.html" target="_blank" rel="noopener" data-t="privacyLink"></a></p>
      </div>
    </section>
  </div>

  <div class="done" id="done" hidden></div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const state = { setup: null, dates: new Set(), desk: null, viewing: null, sending: false, done: null };
  const photos = {};
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- Language ---------- */
  const I18N = {
    en: {
      title: 'Book a desk', intro: 'Pick your days, choose a desk on the floor plan, and you’ll get a confirmation by email.',
      price: 'Day pass <b>{net}</b> + VAT ({gross} incl. VAT)', monthly: 'Monthly desk? <a href="mailto:{email}">Contact us</a>',
      loading: 'Loading free desks…', loadFail: 'The booking page couldn’t load. Refresh the page to try again.',
      step1: 'Pick your days', daysHint: 'Tap a day to add it. Tap it again to remove it. You can book up to {n} days ahead.',
      closed: 'Closed', full: 'Fully booked', remove: 'Remove {day}',
      step2: 'Choose your desk', plan: 'Floor plan', close: 'Close desk preview', photoOf: 'Photo of {desk}',
      hPending: 'Checking which desks are free…', hNone: 'Tap a desk to see a photo. Pick your days first to book one.',
      hNoFree: 'No desk is free on all of your days. Remove a day to see more desks.',
      hMulti: 'Desks shown as free are free on all of your days. Tap one to choose it.', hOne: 'Tap a free desk to choose it.',
      free: 'Free', taken: 'Taken', yours: 'Your desk',
      sIdle: 'Pick your days above to book this desk.', sTaken: 'Taken on one or more of your days.',
      sMine: 'This is your desk. Tap it again to unselect it.', sFree: 'Free on your days. Tap it on the plan to choose it.',
      aIdle: 'pick your days first', aTaken: 'taken', aMine: 'selected', aFree: 'free',
      step3: 'Your details', fName: 'Full name', fEmail: 'Email', fPhone: 'Phone', fAddress: 'Address',
      invoice: 'For your invoice', optional: '(optional)', fCompany: 'Company name', fVat: 'VAT number',
      fComments: 'Comments', commentsPh: 'Anything we should know?',
      needDay: 'Pick at least one day to continue.', needDesk: 'Choose a desk on the floor plan to continue.',
      oneDay: '1 day', nDays: '{n} days', total: 'Total: {net} + VAT = {gross}',
      book: 'Book desk', booking: 'Booking…',
      eEmail: 'Check your email address. It should look like name@example.com.', ePhone: 'Add a phone number with at least 7 digits.',
      eVat: 'A VAT number can only contain letters, numbers, spaces, dots and dashes.',
      eConn: 'No connection. Check your internet and try again.', eFail: 'The booking didn’t go through. Try again in a moment.',
      privacy: 'We use your details only to manage your booking and invoice.', privacyLink: 'Privacy policy',
      doneTitle: 'You’re booked', doneMail: 'A confirmation is on its way to <b>{email}</b>.',
      doneNoMail: 'Your booking is saved, but the confirmation email couldn’t be sent. Keep your reference number.',
      reference: 'Reference', again: 'Book another desk',
      labels: { Entrance: 'Entrance', Kitchen: 'Kitchen', WC: 'WC' }, desk: 'Desk'
    },
    el: {
      title: 'Κλείσε θέση', intro: 'Διάλεξε μέρες, επίλεξε θέση στην κάτοψη και θα λάβεις επιβεβαίωση με email.',
      price: 'Ημερήσια θέση <b>{net}</b> + ΦΠΑ ({gross} με ΦΠΑ)', monthly: 'Μηνιαία θέση; <a href="mailto:{email}">Επικοινώνησε μαζί μας</a>',
      loading: 'Φόρτωση διαθέσιμων θέσεων…', loadFail: 'Η σελίδα δεν φόρτωσε. Ανανέωσε τη σελίδα και δοκίμασε ξανά.',
      step1: 'Διάλεξε μέρες', daysHint: 'Πάτησε μια μέρα για να την προσθέσεις και ξανά για να την αφαιρέσεις. Μπορείς να κλείσεις έως {n} μέρες μπροστά.',
      closed: 'Κλειστά', full: 'Πλήρες', remove: 'Αφαίρεση {day}',
      step2: 'Διάλεξε θέση', plan: 'Κάτοψη', close: 'Κλείσιμο προεπισκόπησης', photoOf: 'Φωτογραφία: {desk}',
      hPending: 'Έλεγχος διαθέσιμων θέσεων…', hNone: 'Πάτησε μια θέση για να δεις φωτογραφία. Διάλεξε πρώτα μέρες για να την κλείσεις.',
      hNoFree: 'Καμία θέση δεν είναι ελεύθερη όλες τις μέρες που διάλεξες. Αφαίρεσε μια μέρα για να δεις περισσότερες.',
      hMulti: 'Οι ελεύθερες θέσεις είναι διαθέσιμες όλες τις μέρες σου. Πάτησε μία για να την επιλέξεις.', hOne: 'Πάτησε μια ελεύθερη θέση για να την επιλέξεις.',
      free: 'Ελεύθερη', taken: 'Κατειλημμένη', yours: 'Η θέση σου',
      sIdle: 'Διάλεξε μέρες παραπάνω για να κλείσεις αυτή τη θέση.', sTaken: 'Κατειλημμένη σε μία ή περισσότερες από τις μέρες σου.',
      sMine: 'Αυτή είναι η θέση σου. Πάτησέ τη ξανά για να την αφαιρέσεις.', sFree: 'Ελεύθερη τις μέρες σου. Πάτησέ τη στην κάτοψη για να την επιλέξεις.',
      aIdle: 'διάλεξε πρώτα μέρες', aTaken: 'κατειλημμένη', aMine: 'επιλεγμένη', aFree: 'ελεύθερη',
      step3: 'Τα στοιχεία σου', fName: 'Ονοματεπώνυμο', fEmail: 'Email', fPhone: 'Τηλέφωνο', fAddress: 'Διεύθυνση',
      invoice: 'Για το τιμολόγιο', optional: '(προαιρετικά)', fCompany: 'Επωνυμία εταιρείας', fVat: 'ΑΦΜ',
      fComments: 'Σχόλια', commentsPh: 'Κάτι που πρέπει να ξέρουμε;',
      needDay: 'Διάλεξε τουλάχιστον μία μέρα για να συνεχίσεις.', needDesk: 'Διάλεξε θέση στην κάτοψη για να συνεχίσεις.',
      oneDay: '1 μέρα', nDays: '{n} μέρες', total: 'Σύνολο: {net} + ΦΠΑ = {gross}',
      book: 'Κράτηση', booking: 'Γίνεται κράτηση…',
      eEmail: 'Έλεγξε το email σου. Πρέπει να μοιάζει με name@example.com.', ePhone: 'Συμπλήρωσε τηλέφωνο με τουλάχιστον 7 ψηφία.',
      eVat: 'Ο ΑΦΜ μπορεί να περιέχει μόνο γράμματα, αριθμούς, κενά, τελείες και παύλες.',
      eConn: 'Δεν υπάρχει σύνδεση. Έλεγξε το internet σου και δοκίμασε ξανά.', eFail: 'Η κράτηση δεν ολοκληρώθηκε. Δοκίμασε ξανά σε λίγο.',
      privacy: 'Χρησιμοποιούμε τα στοιχεία σου μόνο για την κράτηση και την τιμολόγηση.', privacyLink: 'Πολιτική απορρήτου',
      doneTitle: 'Η κράτησή σου έγινε', doneMail: 'Θα λάβεις επιβεβαίωση στο <b>{email}</b>.',
      doneNoMail: 'Η κράτηση αποθηκεύτηκε, αλλά το email επιβεβαίωσης δεν στάλθηκε. Κράτησε τον κωδικό κράτησης.',
      reference: 'Κωδικός κράτησης', again: 'Νέα κράτηση',
      labels: { Entrance: 'Είσοδος', Kitchen: 'Κουζίνα', WC: 'WC' }, desk: 'Θέση'
    }
  };
  let lang = 'en';
  try { lang = localStorage.getItem('ooo-lang') || ''; } catch (e) {}
  if (lang !== 'en' && lang !== 'el') lang = /^el\b/i.test(navigator.language || '') ? 'el' : 'en';
  const t = (key, v) => { let s = I18N[lang][key] ?? I18N.en[key] ?? key; Object.keys(v || {}).forEach(k => { s = s.split('{' + k + '}').join(v[k]); }); return s; };
  const locale = () => lang === 'el' ? 'el-GR' : 'en-GB';
  const deskLabel = name => name.replace(/^Desk/, t('desk'));
  const money = x => new Intl.NumberFormat(locale(), { style: 'currency', currency: 'EUR' }).format(x);
  function fmt(key, opts) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d, 12)).toLocaleDateString(locale(), Object.assign({ timeZone: 'UTC' }, opts));
  }
  const short = key => fmt(key, { weekday: 'short', day: 'numeric', month: 'short' });

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = 'Out of Office – ' + t('title');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    $('comments').placeholder = t('commentsPh');
    $('plan').setAttribute('aria-label', t('plan'));
    $('pClose').setAttribute('aria-label', t('close'));
    $('privacyLink').href = 'privacy.html' + (lang === 'el' ? '#el' : '#en');
    if (!state.sending) $('bookBtn').textContent = t('book');
    renderPrice();
    if (state.setup && !$('app').hidden) { $('daysHint').textContent = t('daysHint', { n: state.setup.daysAhead }); render(); }
    if (state.done) showDone(state.done);
  }
  document.querySelector('.langs').addEventListener('click', e => {
    const b = e.target.closest('button[data-lang]');
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem('ooo-lang', lang); } catch (err) {}
    applyLang();
  });

  /* ---------- Prices ---------- */
  const PRICE = { day: 15, vat: 24 }, CONTACT = { email: 'hello@outofoffice.gr' };
  const price = () => (state.setup && state.setup.price) || PRICE;
  const gross = net => Math.round(net * (1 + price().vat / 100) * 100) / 100;
  function renderPrice() {
    const p = price(), c = (state.setup && state.setup.contact) || CONTACT;
    $('priceLine').innerHTML = t('price', { net: money(p.day), gross: money(gross(p.day)) });
    $('monthlyLine').innerHTML = t('monthly', { email: esc(c.email) });
  }

  /* ---------- Server calls ---------- */
  // Your Google Apps Script link. Bookings and emails go through it.
  const API_URL = 'https://script.google.com/macros/s/AKfycbycrPefjRatt4X_v4MHzNpcdyuSvDNwAEhkuyDG9icW3oW2r-5QKX68g_tbExjeF5k8/exec';
  // Copy of the layout from Code.gs, used only to draw the page before Google answers.
  const DEMO = {"spaceName":"Out of Office","daysAhead":30,"closedWeekdays":[0,6],"floor":{"width":1000,"height":468},"room":{"walls":[[40,40,465,40],[606,40,960,40],[960,40,960,164],[960,296,960,420],[40,420,960,420],[40,40,40,164],[40,296,40,420],[232,40,232,150],[232,310,232,420],[413,40,413,150],[413,310,413,420],[514,190,625,190],[672,190,694,190],[514,190,514,420],[603,190,603,420],[694,40,694,76],[694,190,694,420]],"windows":[[40,164,40,296],[960,164,960,296]],"areas":[{"kind":"kitchen","x":514,"y":190,"w":89,"h":230,"label":"Kitchen"},{"kind":"wc","x":603,"y":190,"w":91,"h":230,"label":"WC"}],"labels":[{"x":535,"y":20,"text":"Entrance","arrow":true}],"rugs":[{"x":745,"y":170,"w":170,"h":125}],"plants":[{"x":70,"y":146,"size":15,"type":"leafy"},{"x":70,"y":314,"size":17,"type":"leafy"},{"x":310,"y":230,"size":22,"type":"palm"},{"x":394,"y":138,"size":14,"type":"leafy"},{"x":722,"y":312,"size":24,"type":"palm"},{"x":936,"y":138,"size":14,"type":"leafy"},{"x":934,"y":318,"size":17,"type":"palm"}]},"desks":[{"name":"Desk 1","x":67,"y":57,"w":129,"h":60,"chair":"bottom","accent":["#B9ACE3"],"about":""},{"name":"Desk 2","x":79,"y":346,"w":131,"h":57,"chair":"top","accent":["#F2A65A","#EE8A86","#9C7BB5"],"about":""},{"name":"Desk 3","x":265,"y":346,"w":116,"h":57,"chair":"top","accent":["#56625A","#E8559A"],"about":""},{"name":"Desk 4","x":268,"y":57,"w":121,"h":60,"chair":"bottom","accent":["#6F8FC9","#F2D64B"],"about":""},{"name":"Desk B1","x":760,"y":57,"w":119,"h":57,"chair":"bottom","accent":["#A7B07E"],"about":""},{"name":"Desk B2","x":718,"y":356,"w":105,"h":50,"chair":"top","accent":["#E9C9A3"],"about":""},{"name":"Desk B3","x":848,"y":356,"w":102,"h":50,"chair":"top","accent":["#C49A6C","#E8E1D6"],"about":""}]};
  function demoSetup() {
    const now = new Date(), days = [];
    for (let i = 0; i < DEMO.daysAhead; i++) {
      const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate() + i, 12));
      days.push({ date: d.toISOString().slice(0, 10), weekday: d.getUTCDay(), closed: DEMO.closedWeekdays.includes(d.getUTCDay()) });
    }
    return { spaceName: DEMO.spaceName, daysAhead: DEMO.daysAhead, floor: DEMO.floor, room: DEMO.room, desks: DEMO.desks,
      hasPhotos: true, days, booked: {} };
  }
  function api(action, arg) {
    const url = API_URL + '?action=' + action + (arg ? '&data=' + encodeURIComponent(JSON.stringify(arg)) : '');
    return fetch(url).then(r => r.json(), () => { throw new Error(t('eConn')); })
      .then(res => { if (!res.ok) throw new Error(res.error); return res.data; });
  }

  /* ---------- Loading ---------- */
  function load() {
    // Draw the calendar and floor plan straight away; free desks fill in when Google answers
    if (!state.setup) { state.setup = demoSetup(); state.setup.pending = true; afterLoad(); }
    api('setup').then(s => { s.hasPhotos = true; s.pending = false; state.setup = s; afterLoad(); }, () => {
      const el = $('loading');
      el.hidden = false; el.className = 'hint loaderr'; el.textContent = t('loadFail');
    });
  }

  function afterLoad() {
    const s = state.setup;
    const open = new Set(s.days.filter(d => !d.closed && !isFull(d.date)).map(d => d.date));
    [...state.dates].forEach(d => { if (!open.has(d)) state.dates.delete(d); });
    $('brand').textContent = s.spaceName;
    $('daysHint').textContent = t('daysHint', { n: s.daysAhead });
    $('loading').hidden = true;
    $('app').hidden = false;
    renderPrice();
    render();
    if (s.hasPhotos) s.desks.forEach(d => loadPhoto(d.name));
  }

  const isFull = date => (state.setup.booked[date] || []).length >= state.setup.desks.length;
  function taken() {
    const tk = new Set();
    state.dates.forEach(d => (state.setup.booked[d] || []).forEach(n => tk.add(n)));
    return tk;
  }

  /* ---------- Rendering ---------- */
  function render() {
    if (state.desk && taken().has(state.desk)) state.desk = null;
    renderCal(); renderChips(); renderPlan(); renderSummary();
  }

  function renderCal() {
    const days = state.setup.days;
    const monday = new Date(Date.UTC(2024, 0, 1, 12));
    let html = [0, 1, 2, 3, 4, 5, 6].map(i => {
      const w = new Date(monday.getTime() + i * 864e5).toLocaleDateString(locale(), { weekday: 'short', timeZone: 'UTC' });
      return `<div class="wd" aria-hidden="true">${esc(w)}</div>`;
    }).join('');
    html += '<div></div>'.repeat((days[0].weekday + 6) % 7);
    days.forEach((d, i) => {
      const dayNum = Number(d.date.slice(8));
      const full = !d.closed && isFull(d.date);
      const on = state.dates.has(d.date);
      const month = (i === 0 || dayNum === 1) ? esc(fmt(d.date, { month: 'short' })) : '&nbsp;';
      const status = d.closed ? ', ' + t('closed') : full ? ', ' + t('full') : '';
      html += `<button type="button" class="day" data-date="${d.date}" aria-pressed="${on}" ${d.closed || full ? 'disabled' : ''}
        aria-label="${esc(fmt(d.date, { weekday: 'long', day: 'numeric', month: 'long' }))}${status}" title="${d.closed ? t('closed') : full ? t('full') : ''}"><small>${month}</small><span class="dn">${dayNum}</span></button>`;
    });
    $('cal').innerHTML = html;
  }

  function renderChips() {
    $('chips').innerHTML = [...state.dates].sort().map(d =>
      `<button type="button" class="chip" data-date="${d}" aria-label="${esc(t('remove', { day: fmt(d, { weekday: 'long', day: 'numeric', month: 'long' }) }))}">${esc(short(d))}<span aria-hidden="true">×</span></button>`
    ).join('');
  }

  function plant(p) {
    const r = p.size || 16;
    let g = `<circle cx="${p.x}" cy="${p.y}" r="${r * .55}" fill="#EDE6D8" stroke="#CFC4B0" stroke-width="2"/>`;
    const n = p.type === 'palm' ? 9 : 6;
    for (let i = 0; i < n; i++) {
      const a = (360 / n) * i + (p.type === 'palm' ? 10 : 25);
      const fill = i % 2 ? '#4E7A4B' : '#6E9A5E';
      g += p.type === 'palm'
        ? `<path d="M${p.x} ${p.y} q${r * .25} ${-r * .55} 0 ${-r} q${-r * .25} ${r * .45} 0 ${r}z" fill="${fill}" transform="rotate(${a} ${p.x} ${p.y})"/>`
        : `<ellipse cx="${p.x}" cy="${p.y - r * .5}" rx="${r * .3}" ry="${r * .5}" fill="${fill}" transform="rotate(${a} ${p.x} ${p.y})"/>`;
    }
    return `<g aria-hidden="true">${g}</g>`;
  }

  function accent(d) {
    const cols = d.accent || [];
    if (!cols.length) return '';
    const side = d.chair || 'bottom', len = Math.min(d.w * .7, 26 * cols.length + 20), seg = len / cols.length;
    const y = side === 'bottom' ? d.y - 12 : d.y + d.h + 6;
    const x0 = d.x + (d.w - len) / 2;
    return cols.map((c, i) => `<rect x="${x0 + i * seg}" y="${y}" width="${seg}" height="6" rx="2" fill="${c}"/>`).join('');
  }

  function chair(d) {
    const side = d.chair || 'bottom', gap = 20;
    const cx = side === 'left' ? d.x - gap : side === 'right' ? d.x + d.w + gap : d.x + d.w / 2;
    const cy = side === 'top' ? d.y - gap : side === 'bottom' ? d.y + d.h + gap : d.y + d.h / 2;
    return `<circle cx="${cx}" cy="${cy}" r="14"/>`;
  }

  function statusOf(name) {
    if (!state.dates.size || state.setup.pending) return 'idle';
    if (taken().has(name)) return 'taken';
    return state.desk === name ? 'mine' : 'free';
  }

  const lbl = s => (I18N[lang].labels || {})[s] || s;

  function renderPlan() {
    const s = state.setup, has = state.dates.size > 0, tk = taken();
    const W = s.floor.width, H = s.floor.height, R = s.room;
    let g = `<defs>
      <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#EFECE6"/><line x1="0" y1="0" x2="0" y2="10" stroke="#CFC8BC" stroke-width="5"/></pattern>
      <pattern id="oak" width="28" height="28" patternUnits="userSpaceOnUse">
        <rect width="28" height="28" fill="#EBCB9F"/>
        <path d="M0 14 L14 0 M14 28 L28 14 M0 14 L14 28 M14 0 L28 14" stroke="#DDB684" stroke-width="1.5" fill="none"/>
      </pattern>
      <pattern id="laminate" width="60" height="14" patternUnits="userSpaceOnUse"><rect width="60" height="14" fill="#ECE6DB"/><path d="M0 13.5H60M30 0V14" stroke="#DCD3C4" stroke-width="1.5"/></pattern>
      <pattern id="tile" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#EEF1F2"/><path d="M16 0H0V16" fill="none" stroke="#D8DEE0" stroke-width="1.5"/></pattern>
    </defs>`;
    g += `<rect x="40" y="40" width="${W - 80}" height="${H - 88}" fill="url(#oak)"/>`;
    (R.areas || []).forEach(a => {
      const fill = a.kind === 'kitchen' ? 'url(#laminate)' : 'url(#tile)';
      g += `<rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" fill="${fill}"/>`;
      if (a.kind === 'kitchen') g += `<rect x="${a.x + 4}" y="${a.y + 6}" width="18" height="${a.h - 12}" rx="3" fill="#8BAA83"/>`;
    });
    (R.rugs || []).forEach(r => { g += `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="8" fill="#5E7462" opacity=".7"/>`; });
    (R.windows || []).forEach(w => { g += `<line class="window" x1="${w[0]}" y1="${w[1]}" x2="${w[2]}" y2="${w[3]}"/>`; });
    (R.walls || []).forEach(w => { g += `<line class="wall" x1="${w[0]}" y1="${w[1]}" x2="${w[2]}" y2="${w[3]}"/>`; });
    (R.areas || []).forEach(a => {
      if (a.label) g += `<text class="lbl" x="${a.x + a.w / 2 + (a.kind === 'kitchen' ? 9 : 0)}" y="${a.y + a.h / 2}" text-anchor="middle" dominant-baseline="central">${esc(lbl(a.label))}</text>`;
    });
    (R.labels || []).forEach(l => {
      g += `<text class="lbl" x="${l.x}" y="${l.y}" text-anchor="middle" dominant-baseline="central">${esc(lbl(l.text))}</text>`;
      if (l.arrow) g += `<path class="arrow" d="M${l.x - 9} ${l.y + 26} h18 l-9 12 z"/>`;
    });
    (R.plants || []).forEach(p => { g += plant(p); });
    s.desks.forEach(d => {
      const st = statusOf(d.name);
      const label = t({ idle: 'aIdle', taken: 'aTaken', mine: 'aMine', free: 'aFree' }[st]);
      g += `<g class="desk ${st}${state.viewing === d.name ? ' viewing' : ''}" data-desk="${esc(d.name)}" tabindex="0" role="button" aria-label="${esc(deskLabel(d.name))}, ${esc(label)}">
        ${accent(d)}${chair(d)}
        <rect class="top" x="${d.x}" y="${d.y}" width="${d.w}" height="${d.h}" rx="6"/>
        <text x="${d.x + d.w / 2}" y="${d.y + d.h / 2}" text-anchor="middle" dominant-baseline="central">${esc(deskLabel(d.name))}</text></g>`;
    });
    const svg = $('plan');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = g;

    const free = s.desks.filter(d => !tk.has(d.name)).length;
    $('planHint').textContent = t(s.pending && has ? 'hPending' : !has ? 'hNone' : free === 0 ? 'hNoFree' : state.dates.size > 1 ? 'hMulti' : 'hOne');
    renderPreview();
  }

  function renderPreview() {
    const name = state.viewing, box = $('preview');
    if (!name) { box.hidden = true; return; }
    const d = state.setup.desks.find(x => x.name === name);
    if (!d) { box.hidden = true; return; }
    box.hidden = false;
    box.classList.toggle('left', d.x + d.w / 2 > state.setup.floor.width / 2);
    $('pName').textContent = deskLabel(d.name);
    $('pAbout').textContent = d.about || '';
    $('pAbout').hidden = !d.about;
    const st = statusOf(d.name), el = $('pStatus');
    el.className = 'status ' + (st === 'mine' ? 'ok' : st === 'free' ? '' : 'no');
    el.textContent = t({ idle: 'sIdle', taken: 'sTaken', mine: 'sMine', free: 'sFree' }[st]);
    const src = photos[d.name];
    box.classList.toggle('no-photo', src === null);
    const img = $('pImg');
    if (src) { img.src = src; img.alt = t('photoOf', { desk: deskLabel(d.name) }); }
    else { img.removeAttribute('src'); img.alt = ''; }
    if (!(d.name in photos)) loadPhoto(d.name);
  }

  // Desk photos live next to this page: "Desk B2" -> desk-b2.jpg
  const photoUrl = name => name.toLowerCase().replace(/\s+/g, '-') + '.jpg';
  function loadPhoto(name) {
    if (name in photos) return;
    photos[name] = undefined; // loading
    const img = new Image();
    img.onload = () => { photos[name] = photoUrl(name); if (state.viewing === name) renderPreview(); };
    img.onerror = () => { photos[name] = null; if (state.viewing === name) renderPreview(); };
    img.src = photoUrl(name);
  }

  function renderSummary() {
    const n = state.dates.size;
    $('summary').textContent = !n ? t('needDay') : !state.desk ? t('needDesk')
      : `${deskLabel(state.desk)}, ${t(n === 1 ? 'oneDay' : 'nDays', { n })}: ${[...state.dates].sort().map(short).join(', ')}`;
    const net = n * price().day;
    $('total').hidden = !n;
    $('total').textContent = n ? t('total', { net: money(net), gross: money(gross(net)) }) : '';
    const filled = !state.setup.pending && ['name', 'email', 'phone', 'address'].every(id => $(id).value.trim());
    $('bookBtn').disabled = state.sending || !n || !state.desk || !filled;
  }

  /* ---------- Interaction ---------- */
  function toggleDate(date) {
    state.dates.has(date) ? state.dates.delete(date) : state.dates.add(date);
    $('msg').textContent = '';
    render();
  }

  $('cal').addEventListener('click', e => {
    const b = e.target.closest('.day');
    if (!b || b.disabled) return;
    toggleDate(b.dataset.date);
    const again = $('cal').querySelector(`[data-date="${b.dataset.date}"]`);
    if (again) again.focus();
  });

  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (b) toggleDate(b.dataset.date);
  });

  function pickDesk(el) {
    if (!el) return;
    const name = el.dataset.desk, st = statusOf(name);
    if (st === 'mine') state.desk = null;
    else if (st === 'free') state.desk = name;
    state.viewing = name;
    $('msg').textContent = '';
    render();
    const again = [...$('plan').querySelectorAll('.desk')].find(g => g.dataset.desk === name);
    if (again) again.focus();
  }
  function closePreview() {
    const name = state.viewing;
    state.viewing = null;
    render();
    const el = [...$('plan').querySelectorAll('.desk')].find(g => g.dataset.desk === name);
    if (el) el.focus();
  }
  $('pClose').addEventListener('click', closePreview);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.viewing) closePreview(); });
  $('plan').addEventListener('click', e => pickDesk(e.target.closest('.desk')));
  $('plan').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickDesk(e.target.closest('.desk')); }
  });

  ['name', 'email', 'phone', 'address'].forEach(id => $(id).addEventListener('input', renderSummary));

  function check(req) {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(req.email)) return t('eEmail');
    if (!/^[+0-9 ().\-]+$/.test(req.phone) || req.phone.replace(/\D/g, '').length < 7) return t('ePhone');
    if (req.vat && !/^[A-Za-z0-9 .\-]+$/.test(req.vat)) return t('eVat');
    return '';
  }

  $('bookBtn').addEventListener('click', () => {
    const req = {
      dates: [...state.dates].sort(), desk: state.desk, lang,
      name: $('name').value.trim(), email: $('email').value.trim(), phone: $('phone').value.trim(),
      company: $('company').value.trim(), address: $('address').value.trim(), vat: $('vat').value.trim(), comments: $('comments').value.trim()
    };
    const problem = check(req);
    if (problem) { $('msg').textContent = problem; return; }
    state.sending = true;
    $('bookBtn').disabled = true;
    $('bookBtn').textContent = t('booking');
    $('msg').textContent = '';
    api('book', req).then(showDone, err => {
      state.sending = false;
      $('bookBtn').textContent = t('book');
      const m = (err && err.message ? err.message : '').replace(/^(Error|Exception):\s*/, '');
      $('msg').textContent = m || t('eFail');
      load(); // refresh which desks are free
    });
  });

  function showDone(res) {
    state.sending = false;
    state.done = res;
    $('app').hidden = true;
    const list = res.dates.map(d => `<li>${esc(fmt(d, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }))}</li>`).join('');
    const net = res.dates.length * price().day;
    $('done').innerHTML = `<h2>${esc(t('doneTitle'))}</h2>
      <p><b>${esc(deskLabel(res.desk))}</b></p><ul>${list}</ul>
      <p>${esc(t('total', { net: money(net), gross: money(gross(net)) }))}</p>
      <p>${res.emailed ? t('doneMail', { email: esc(res.email) }) : esc(t('doneNoMail'))}</p>
      <p>${esc(t('reference'))}: ${esc(res.id)}</p>
      <button type="button" class="secondary" id="again">${esc(t('again'))}</button>`;
    $('done').hidden = false;
    $('again').addEventListener('click', () => {
      state.dates.clear(); state.desk = null; state.done = null;
      $('bookBtn').textContent = t('book');
      $('done').hidden = true;
      $('loading').hidden = false; $('loading').textContent = t('loading');
      load();
    });
    window.scrollTo(0, 0);
  }

  applyLang();
  load();
</script>
</body>
</html>
